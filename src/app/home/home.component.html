<app-search></app-search>
<app-tags></app-tags>
<app-not-found [visible]="!foods || foods.length <= 0 " resetLinkText="Reset Search"></app-not-found>
<ul>
    <li *ngFor="let food of foods">
        <a routerLink="/food/{{food.id}}">
        <img src="{{food.imageUrl}}" alt="food images" >
        <div class="content">
            <div class="name">
                {{food.name}}
            </div>
            <span class="favorite {{food.favorite?'':'not'}}">&#10084;</span>
            <app-star-rating [rating]="food.stars"></app-star-rating>
            <div class="product-item-footer">
                    <div class="origins">
                        <span *ngFor="let origin of food.origins">
                            {{origin}}
                        </span>
                    </div>
            </div>
            <div class="cook-time">
                <span>🕑
                    {{food.cookTime}}
                </span>
            </div>
            <div class="price">
                {{food.price|currency}}
            </div>
        </div>
    </a>
    </li>
</ul>
